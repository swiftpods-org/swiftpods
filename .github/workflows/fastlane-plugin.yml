name: Fastlane plugin
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'Tests/FastlanePlugin/**'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'scripts/install.py'
      - '.github/workflows/fastlane-plugin.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'Tests/FastlanePlugin/**'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'scripts/install.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
        ruby: ['3.0.7', '4.0.9']
    env:
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.5.23'
          bundler-cache: true
      - name: Build the gem
        run: |
          bundle exec gem build fastlane-plugin-swiftpods.gemspec --strict --output "$RUNNER_TEMP/plugin.gem"
          ruby -rrubygems/package -e '
            expected = File.read("Sources/swiftpods/main.swift")[/^let version = "([^"]+)"/, 1]
            actual = Gem::Package.new(ARGV.fetch(0)).spec.version.to_s
            abort "Built gem version #{actual} differs from source version #{expected}" unless actual == expected
          ' "$RUNNER_TEMP/plugin.gem"
