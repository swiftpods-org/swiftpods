name: Package Fastlane plugin
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'Profiles/baseline.json'
      - 'docs/Fastlane.md'
      - '.github/workflows/fastlane-plugin.yml'
      - '.github/actions/setup-runtime/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'Profiles/baseline.json'
      - 'docs/Fastlane.md'
      - '.github/workflows/fastlane-plugin.yml'
      - '.github/actions/setup-runtime/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
      - name: Build the plugin package
        run: |
          mkdir -p dist
          gem build fastlane-plugin-swiftpods.gemspec --strict --output dist/fastlane-plugin-swiftpods.gem
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fastlane-plugin-swiftpods
          path: dist/fastlane-plugin-swiftpods.gem
