name: Package Fastlane plugin
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'scripts/install.py'
      - 'scripts/prepare_integrations.py'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'Profiles/baseline.json'
      - 'docs/Fastlane.md'
      - '.github/workflows/fastlane-plugin.yml'
      - '.github/actions/setup-runtime/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'scripts/install.py'
      - 'scripts/prepare_integrations.py'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'Profiles/baseline.json'
      - 'docs/Fastlane.md'
      - '.github/workflows/fastlane-plugin.yml'
      - '.github/actions/setup-runtime/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      release_assets:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Create temporary build directory
        run: |
          build_root="$(mktemp -d "$RUNNER_TEMP/swiftpods-plugin.XXXXXX")"
          echo "SWIFTPODS_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-runtime
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: inputs.release_assets
        with:
          name: swiftpods-assets
          path: ${{ env.SWIFTPODS_BUILD_ROOT }}/release-assets
      - name: Pin the assembled CLI release
        if: inputs.release_assets
        run: python3 scripts/prepare_integrations.py "$SWIFTPODS_BUILD_ROOT/release-assets/release.json"
      - name: Build the plugin package
        run: |
          gem build fastlane-plugin-swiftpods.gemspec --strict --output "$SWIFTPODS_BUILD_ROOT/fastlane-plugin-swiftpods.gem"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fastlane-plugin-swiftpods
          path: ${{ env.SWIFTPODS_BUILD_ROOT }}/fastlane-plugin-swiftpods.gem
      - name: Remove temporary build files
        if: always()
        run: |
          if [[ -n "${SWIFTPODS_BUILD_ROOT:-}" ]]; then
            rm -rf -- "$SWIFTPODS_BUILD_ROOT"
          fi
