name: Fastlane plugin
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'Tests/FastlanePlugin/**'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'scripts/install.py'
      - '.github/workflows/fastlane-plugin.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'Tests/FastlanePlugin/**'
      - 'fastlane-plugin-swiftpods.gemspec'
      - 'scripts/install.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install fastlane
        run: |
          gem_home="$RUNNER_TEMP/gems"
          echo "GEM_HOME=$gem_home" >> "$GITHUB_ENV"
          echo "GEM_PATH=$gem_home" >> "$GITHUB_ENV"
          GEM_HOME="$gem_home" gem install --no-document fastlane minitest
      - name: Run plugin tests
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/plugin-tests.log"
          if ! ruby Tests/FastlanePlugin/run.rb 2>&1 | tee "$log"; then
            # Annotations are public, so a failure is readable without access to the job log.
            message="$(grep -v '^Ignoring ' "$log" | tail -30)"
            message="${message//'%'/%25}"
            printf '::error title=Plugin tests::%s\n' "${message//$'\n'/%0A}"
            exit 1
          fi
      - name: Build the gem
        run: gem build fastlane-plugin-swiftpods.gemspec --strict --output "$RUNNER_TEMP/plugin.gem"
