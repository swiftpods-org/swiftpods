name: Compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - name: Install external Ruby
        run: |
          brew update
          brew install ruby@3.4 cmake subversion mercurial
          brew upgrade ruby@3.4
          echo "SWIFTPODS_RUBY=$(brew --prefix ruby@3.4)/bin/ruby" >> "$GITHUB_ENV"
      - name: Prepare native DSL adapter
        run: |
          set -o pipefail
          mkdir -p test-results
          python3 scripts/bootstrap.py 2>&1 | tee test-results/bootstrap.log
      - name: Run compatibility and relocation corpus
        run: python3 scripts/check.py --full --package dist/SwiftPods-${{ matrix.runner }}
      - name: Install and test the generated Homebrew formula
        run: |
          python3 scripts/native_homebrew_tests.py --bundle dist/SwiftPods-${{ matrix.runner }}
          python3 scripts/evidence.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-${{ matrix.runner }}
          include-hidden-files: true
          path: |
            test-results/
            .runtime/compatibility.json
            .build/native-homebrew-*/homebrew.log
          if-no-files-found: error
      - name: Archive native distribution with executable permissions
        run: |
          /usr/bin/ditto -c -k --norsrc --noextattr --noqtn --keepParent dist/SwiftPods-${{ matrix.runner }} dist/SwiftPods-${{ matrix.runner }}.zip
          /usr/bin/shasum -a 256 dist/SwiftPods-${{ matrix.runner }}.zip > dist/SwiftPods-${{ matrix.runner }}.zip.sha256
      - name: Preserve native distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: swiftpods-${{ matrix.runner }}
          path: |
            dist/SwiftPods-${{ matrix.runner }}.zip
            dist/SwiftPods-${{ matrix.runner }}.zip.sha256
          if-no-files-found: error
