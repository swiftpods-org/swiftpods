name: Compatibility
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stop-tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automated tests are disabled in CI/CD."
