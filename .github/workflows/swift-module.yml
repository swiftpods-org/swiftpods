name: Swift binary module compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/**'
      - 'scripts/*swift_binary*'
      - '.github/workflows/swift-module.yml'
permissions:
  contents: read
jobs:
  producer:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/swift_binary_producer.py --destination .build/swift-producer
      - name: Preserve framework symlinks and compiler provenance
        run: /usr/bin/ditto -c -k --norsrc --noextattr --noqtn --keepParent .build/swift-producer producer.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: swift-producer
          path: producer.zip
  consumer:
    needs: producer
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: swift-producer
          path: .build/download
      - run: /usr/bin/ditto -x -k .build/download/producer.zip .build/imported
      - name: Install external Ruby
        run: |
          brew install ruby@3.4
          echo "SWIFTPODS_RUBY=$(brew --prefix ruby@3.4)/bin/ruby" >> "$GITHUB_ENV"
      - run: python3 scripts/bootstrap.py
      - run: swift build -Xswiftc -warnings-as-errors
      - name: Execute consumers built with another Swift compiler
        run: |
          python3 scripts/native_swift_binary_tests.py \
            --producer-framework .build/imported/swift-producer/SwiftBinaryKit.framework \
            --producer-manifest .build/imported/swift-producer/producer.json
          python3 -c 'import json; r=json.load(open("test-results/native-swift-binary.json")); assert r["cross_toolchain"] and len(r["executions"]) == 6'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: swift-module-evidence
          include-hidden-files: true
          path: |
            test-results/native-swift-binary.json
            .build/native-swift-binary-*/**/*.log
            .build/imported/swift-producer/producer.json
