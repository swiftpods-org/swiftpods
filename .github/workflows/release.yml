name: Release SwiftPods
on:
  push:
    tags: ['v*', 'replace-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag version without v
        required: true
      replace_existing:
        description: Replace this release and tag with the selected source ref after building
        type: boolean
        default: false
      cancel_only:
        description: Cancel the active release for this version without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: ${{ startsWith(github.ref_name, 'replace-v') || (github.event_name == 'workflow_dispatch' && (inputs.replace_existing || inputs.cancel_only)) }}
jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      replace-tag-object: ${{ steps.resolve.outputs.replace-tag-object }}
      replace: ${{ steps.resolve.outputs.replace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        name: Resolve and validate the release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          CANCEL_ONLY: ${{ inputs.cancel_only }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pushed = os.environ['GITHUB_EVENT_NAME'] == 'push'
          replacement_tag = pushed and os.environ['GITHUB_REF_NAME'].startswith('replace-v')
          version = os.environ['GITHUB_REF_NAME'].removeprefix('replace-')[1:] if pushed else os.environ['REQUESTED_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', version):
              raise RuntimeError('Invalid release version')
          if os.environ['CANCEL_ONLY'] == 'true':
              print('Cancelled the active release for v' + version)
              raise SystemExit(0)
          tag = 'refs/tags/v' + version
          replace = replacement_tag or (not pushed and os.environ['REPLACE_EXISTING'] == 'true')
          tag_object = subprocess.check_output(['git', 'rev-parse', '--verify', tag], text=True).strip() if replace else ''
          source = os.environ['GITHUB_SHA'] if replace else tag + '^{commit}'
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', source], text=True).strip()
          baseline = json.loads(subprocess.check_output(['git', 'show', commit + ':Profiles/baseline.json']))
          if baseline['swiftpods_version'] != version:
              raise RuntimeError('Tag must match Profiles/baseline.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\ncommit=' + commit + '\n')
              output.write('replace-tag-object=' + tag_object + '\n')
              output.write('replace=' + str(replace).lower() + '\n')
          PY
      - name: Cancel superseded release builds
        if: steps.resolve.outputs.replace == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=in_progress" --jq '.workflow_runs[].id')
          for run_id in $runs; do
            if [[ "$run_id" == "$GITHUB_RUN_ID" ]]; then continue; fi
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
              if [[ "$status" != 'completed' ]]; then exit 1; fi
            fi
          done
  plugin:
    needs: [metadata, assemble]
    uses: ./.github/workflows/fastlane-plugin.yml
    with:
      source_ref: ${{ needs.metadata.outputs.commit }}
      release_assets: true
  build:
    if: inputs.cancel_only != true
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - name: Validate tagged version
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 -c 'import json, os; assert json.load(open("Profiles/baseline.json"))["swiftpods_version"] == os.environ["RELEASE_VERSION"]'
      - uses: ./.github/actions/setup-runtime
      - run: python3 scripts/bootstrap.py
      - name: Import explicitly configured release credentials
        env:
          SWIFTPODS_SIGNING_P12: ${{ secrets.SWIFTPODS_SIGNING_P12 }}
          SWIFTPODS_SIGNING_PASSWORD: ${{ secrets.SWIFTPODS_SIGNING_PASSWORD }}
          SWIFTPODS_SIGNING_IDENTITY: ${{ secrets.SWIFTPODS_SIGNING_IDENTITY }}
          SWIFTPODS_NOTARY_KEY: ${{ secrets.SWIFTPODS_NOTARY_KEY }}
          SWIFTPODS_NOTARY_KEY_ID: ${{ secrets.SWIFTPODS_NOTARY_KEY_ID }}
          SWIFTPODS_NOTARY_ISSUER: ${{ secrets.SWIFTPODS_NOTARY_ISSUER }}
        run: python3 scripts/ci_signing.py setup
      - name: Build the signed and notarized distribution
        run: |
          python3 scripts/package.py --destination dist/SwiftPods
          python3 scripts/sign_release.py dist/SwiftPods \
            --identity "$SWIFTPODS_SIGNING_IDENTITY" \
            --notarize --keychain-profile "$SWIFTPODS_NOTARY_PROFILE" \
            --keychain "$SWIFTPODS_NOTARY_KEYCHAIN"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.runner }}
          path: |
            dist/SwiftPods.zip
            dist/SwiftPods.zip.notary.json
      - name: Remove temporary signing credentials
        if: always()
        run: python3 scripts/ci_signing.py cleanup
  assemble:
    needs: [metadata, build]
    runs-on: macos-15
    outputs:
      manifest-sha256: ${{ steps.validate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: .build/release-inputs
      - name: Assemble release archives, checksums and installer
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 scripts/release.py --version "$RELEASE_VERSION" \
            --archive .build/release-inputs/release-macos-15/SwiftPods.zip \
            --archive .build/release-inputs/release-macos-15-intel/SwiftPods.zip \
            --notarization .build/release-inputs/release-macos-15/SwiftPods.zip.notary.json \
            --notarization .build/release-inputs/release-macos-15-intel/SwiftPods.zip.notary.json \
            --destination dist/release
      - id: validate
        name: Validate public release assets
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python3 scripts/publish_release.py dist/release --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: swiftpods-assets
          path: dist/release/
  publish:
    needs: [metadata, assemble, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: swiftpods-assets
          path: dist/release
      - name: Publish the signed archives and installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          REPLACE_TAG_OBJECT: ${{ needs.metadata.outputs.replace-tag-object }}
        run: |
          options=()
          if [[ -n "$REPLACE_TAG_OBJECT" ]]; then
            options+=(--replace-tag-object "$REPLACE_TAG_OBJECT")
          fi
          python3 scripts/publish_release.py dist/release --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --publish "${options[@]}"
  update-integrations:
    needs: [metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: swiftpods-assets
          path: .build/release-assets
      - id: current
        name: Keep the tap aligned with the current release series
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          current = json.loads(Path('Profiles/baseline.json').read_text())['swiftpods_version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('update=' + str(current == os.environ['RELEASE_VERSION']).lower() + '\n')
          PY
      - name: Update the Homebrew tap and Fastlane release pin
        if: steps.current.outputs.update == 'true'
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          REPLACE_EXISTING: ${{ needs.metadata.outputs.replace }}
        run: |
          python3 scripts/prepare_integrations.py .build/release-assets/release.json
          git add Formula/swiftpods.rb lib/fastlane/plugin/swiftpods/release.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Homebrew and Fastlane release pins'
            git push origin HEAD:main
          fi
          plugin_tag="fastlane-v$RELEASE_VERSION"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$plugin_tag")"
          if [[ -z "$remote_tag" ]]; then
            git tag "$plugin_tag"
            git push origin "refs/tags/$plugin_tag"
          elif [[ "$REPLACE_EXISTING" == 'true' ]]; then
            read -r tag_object tag_ref <<< "$remote_tag"
            git tag -f "$plugin_tag"
            git push --force-with-lease="refs/tags/$plugin_tag:$tag_object" origin "refs/tags/$plugin_tag"
          fi
