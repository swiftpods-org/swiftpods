name: Select external Ruby
description: Install the Ruby toolchain used to build and package SwiftPods
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
      with:
        ruby-version: '3.4.11'
        bundler: none
    - shell: bash
      run: echo "SWIFTPODS_RUBY=$(ruby -rrbconfig -e 'print RbConfig.ruby')" >> "$GITHUB_ENV"
