name: Prepare verification tools
description: Select the supported external Ruby and verify runner build tools
runs:
  using: composite
  steps:
    - id: profile
      shell: bash
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        profile = json.loads(Path('Profiles/baseline.json').read_text())
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('ruby-version=' + profile['runtime']['minimum_version'] + '\n')
        PY
    - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
      with:
        ruby-version: ${{ steps.profile.outputs.ruby-version }}
        bundler: none
    - id: vcs
      uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
      with:
        environment-name: swiftpods-vcs
        environment-file: ''
        create-args: >-
          --channel conda-forge --strict-channel-priority
          subversion=1.14.5 mercurial=7.1.2
        init-shell: none
        generate-run-shell: false
        micromamba-root-path: ${{ runner.temp }}/swiftpods-vcs
        post-cleanup: all
    - shell: bash
      env:
        VCS_ENVIRONMENT: ${{ steps.vcs.outputs.environment-path }}
      run: |
        echo "SWIFTPODS_RUBY=$(ruby -rrbconfig -e 'print RbConfig.ruby')" >> "$GITHUB_ENV"
        command -v cmake
        vcs_bin="$RUNNER_TEMP/swiftpods-vcs-bin"
        mkdir -p "$vcs_bin"
        for tool in svn svnadmin hg; do
          test -x "$VCS_ENVIRONMENT/bin/$tool"
          ln -s "$VCS_ENVIRONMENT/bin/$tool" "$vcs_bin/$tool"
        done
        echo "$vcs_bin" >> "$GITHUB_PATH"
